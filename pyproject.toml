[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-hub"
version = "2.0.0"
description = "Automated Ingestion, Parsing, and Ledger System for Indonesian Personal Finance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.8.0",
    "duckdb>=1.1.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
    "gspread>=6.2.0",
    "google-auth>=2.30.0"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
